<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RoofCON 8 Sales Board</title>
<style>
/* Written for old TV browsers: no CSS variables, grid, clamp(), gap or modern JS. */
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#121211;color:#EDECE8;font-family:"Arial Black",Arial,Helvetica,sans-serif;font-size:16px;line-height:1.3;overflow:hidden}
.wrap{height:100%;padding:2vh 3vw}
.mast{height:11vh;border-bottom:.5vh solid #EDECE8;position:relative}
.mark{margin:0;font-size:7.5vh;line-height:1;font-weight:900;position:absolute;left:0;bottom:1vh;letter-spacing:-1px}
.mark span{color:#A3A19B}
.sub{position:absolute;right:0;bottom:1.2vh;font-size:2vh;font-family:Arial,Helvetica,sans-serif;font-weight:bold;text-transform:uppercase;letter-spacing:2px;color:#A3A19B}
.cols{height:82vh;margin:1vh -.6vw 0 -.6vw;font-size:0;white-space:nowrap}
.col{display:inline-block;vertical-align:top;height:100%;font-size:16px;white-space:normal}
.left{width:62%}
.right{width:38%}
.cell{display:inline-block;vertical-align:top;padding:.6vh .6vw;font-size:16px}
.w100{width:100%;height:30vh}.w33{width:33.333%;height:20vh}.tbl{width:100%;height:32vh}.full{width:100%;height:82vh}
.card{height:100%;background:#1B1B1A;border:1px solid #34332F;padding:1.6vh 1.2vw;overflow:hidden;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-pack:center;-webkit-justify-content:center;justify-content:center}
.k{font-family:Arial,Helvetica,sans-serif;font-size:1.9vh;text-transform:uppercase;letter-spacing:2px;color:#A3A19B}
.v{font-size:9vh;line-height:1.1;font-weight:900;margin-top:.5vh;white-space:nowrap}
.v.sm{font-size:6vh}
.v small{font-size:.42em}
.n{font-family:Arial,Helvetica,sans-serif;font-size:2vh;color:#A3A19B;margin-top:.6vh}
.bar{height:2.2vh;background:#262624;margin-top:1.6vh;position:relative}
.bar i{position:absolute;top:0;bottom:0;left:0;background:#EDECE8}
.bar b{position:absolute;top:-.6vh;bottom:-.6vh;width:3px;background:#F2B705}
.hi{color:#F2B705}.ok{color:#5FBF86}.warn{color:#E58A50}
/* breakdown table */
.bt{width:100%;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;margin-top:.4vh}
.bt th{font-size:1.8vh;text-transform:uppercase;letter-spacing:2px;color:#A3A19B;text-align:right;font-weight:bold;padding:.3vh .4vw .8vh}
.bt th:first-child,.bt td:first-child{text-align:left}
.bt td{font-size:3.4vh;font-weight:bold;text-align:right;padding:.9vh .4vw;border-top:1px solid #34332F;white-space:nowrap}
.bt td:first-child{font-size:2vh;text-transform:uppercase;letter-spacing:2px;color:#A3A19B}
.bt td small{display:block;font-size:1.8vh;font-weight:normal;color:#A3A19B;margin-top:.2vh}
/* tasks */
.tasks{display:block;padding:1.6vh 1.2vw}
.th{font-family:Arial,Helvetica,sans-serif;font-size:1.9vh;text-transform:uppercase;letter-spacing:2px;color:#A3A19B;margin-bottom:1vh}
.th b{color:#EDECE8}
#tl{margin:0;padding:0;list-style:none;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-size:2.6vh;line-height:1.25}
#tl li{padding:.7vh 0;border-top:1px solid #34332F;position:relative;padding-left:3.4vh;font-weight:bold}
#tl li:first-child{border-top:0}
#tl .m{position:absolute;left:0;top:.7vh;width:2.4vh;height:2.4vh;border:2px solid #A3A19B;border-radius:50%}
#tl li.d{color:#7C7A75;text-decoration:line-through;font-weight:normal}
#tl li.d .m{background:#5FBF86;border-color:#5FBF86}
#tl .o{display:inline-block;font-size:.7em;font-weight:bold;text-transform:uppercase;letter-spacing:1px;color:#121211;background:#A3A19B;padding:0 .5em;margin-right:.5em;border-radius:2px;vertical-align:middle;text-decoration:none}
#tl li.d .o{background:#4a4945;color:#9c9a95}
#tmore{font-family:Arial,Helvetica,sans-serif;color:#A3A19B;font-size:2vh;margin-top:.6vh}
.foot{position:absolute;left:3vw;right:3vw;bottom:.8vh;font-family:Courier New,monospace;font-size:1.7vh;color:#A3A19B}
.foot .r{float:right}
@media (max-width:800px){body{overflow:auto}.wrap{height:auto;padding-bottom:6vh}.cols{height:auto;white-space:normal}.col{width:100%!important;height:auto}.cell{height:auto!important}.w100,.tbl{width:100%}.w33{width:50%}.full{width:100%}.v{font-size:36px}.v.sm{font-size:30px}.foot{position:static;margin-top:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <h1 class="mark">ROOF<span>CON</span> 8</h1>
    <div class="sub">Sales board &middot; Nov 10&ndash;12 &middot; Oklahoma City</div>
  </div>
  <div class="cols">
    <div class="col left" id="left"><div class="cell w100"><div class="card"><div class="k">Loading&hellip;</div></div></div></div><div class="col right"><div class="cell full"><div class="card tasks"><div class="th" id="th">Today&rsquo;s tasks</div><ul id="tl"></ul><div id="tmore"></div></div></div></div>
  </div>
  <div class="foot"><span class="r">Ticket revenue excludes booths</span><span id="upd"></span></div>
</div>
<script>
(function(){
var GOAL=150000, START="2026-10-13", EVENT="2026-11-10";
var STEPS=[["2026-10-13",125],["2026-10-16",150],["2026-10-23",175],["2026-10-30",197]];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function money(n){n=Math.round(n);var s=String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",");return (n<0?"-":"")+"$"+s}
function pad(n){return n<10?"0"+n:""+n}
// Today's date in Eastern time, computed without Intl so old browsers work.
function todayET(){
  var now=new Date(), y=now.getUTCFullYear();
  function nthSun(year,month,n){var d=new Date(Date.UTC(year,month,1));var off=(7-d.getUTCDay())%7;return 1+off+7*(n-1)}
  var dstStart=Date.UTC(y,2,nthSun(y,2,2),7), dstEnd=Date.UTC(y,10,nthSun(y,10,1),6);
  var offset=(now.getTime()>=dstStart&&now.getTime()<dstEnd)?-4:-5;
  var et=new Date(now.getTime()+offset*3600000);
  return et.getUTCFullYear()+"-"+pad(et.getUTCMonth()+1)+"-"+pad(et.getUTCDate());
}
function dayNum(s){var p=s.split("-");return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function gaPrice(t){var p=STEPS[0][1];for(var i=0;i<STEPS.length;i++){if(t>=STEPS[i][0])p=STEPS[i][1]}return p}
function nextStep(t){for(var i=0;i<STEPS.length;i++){if(STEPS[i][0]>t)return STEPS[i]}return null}
var MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtDay(s){var p=s.split("-"),d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));return WD[d.getUTCDay()]+", "+MO[d.getUTCMonth()]+" "+(+p[2])}
function render(data){
  var t=todayET(), days=data.days||[];
  function sum(k){var a=0;for(var i=0;i<days.length;i++)a+=(+days[i][k]||0);return a}
  var rev=sum("rev"),booth=sum("booth"),booths=sum("booths"),ga=sum("ga"),vip=sum("vip"),pkg=sum("pkg");
  var left=Math.max(0,dayNum(EVENT)-dayNum(t));
  // Pace counts completed days only: revenue through yesterday vs. yesterday's pace target.
  var elapsed=Math.max(0,Math.min(28,dayNum(t)-dayNum(START)));
  var revPrev=0;for(var j=0;j<days.length;j++){if(days[j].date<t)revPrev+=(+days[j].rev||0)}
  var pace=GOAL/28*elapsed, diff=revPrev-pace, need=Math.max(0,GOAL-rev);
  var perDay=left>0?need/left:need;
  var today={rev:0,ga:0,vip:0,pkg:0};
  for(var i=0;i<days.length;i++){if(days[i].date===t)today=days[i]}
  var ns=nextStep(t);
  var pct=Math.min(100,rev/GOAL*100), pp=Math.min(100,pace/GOAL*100);
  var h="";
  h+='<div class="cell w100"><div class="card"><div class="k">Ticket revenue &middot; minimum goal '+money(GOAL)+'</div>'
   +'<div class="v">'+money(rev)+' <small class="'+(diff>=0?"ok":"warn")+'">'+(diff>=0?"&#9650; ":"&#9660; ")+money(Math.abs(diff))+(diff>=0?" ahead of":" behind")+' pace thru yesterday</small></div>'
   +'<div class="bar"><i style="width:'+pct+'%"></i><b style="left:'+pp+'%"></b></div>'
   +'<div class="n">'+pct.toFixed(1)+'% of goal &middot; need '+money(need)+' more &middot; '+money(perDay)+'/day to finish</div></div></div>';
  h+='<div class="cell w33"><div class="card"><div class="k">Doors open in</div><div class="v sm">'+left+' days</div><div class="n">Tue Nov 10 &middot; OKC</div></div></div>';
  h+='<div class="cell w33"><div class="card"><div class="k">GA price now</div><div class="v sm hi">$'+gaPrice(t)+'</div><div class="n">'+(ns?("$"+ns[1]+" on "+fmtDay(ns[0])):"Final price")+'</div></div></div>';
  h+='<div class="cell w33"><div class="card"><div class="k">Today so far</div><div class="v sm">'+money(+today.rev||0)+'</div><div class="n">'+(+today.ga||0)+' GA &middot; '+(+today.vip||0)+' VIP'+(+today.pkg?' &middot; '+(+today.pkg)+' pkg':'')+'</div></div></div>';
  // Week to date (Mon-Sun, Eastern) and month to date.
  var tp=t.split("-"),dow=new Date(Date.UTC(+tp[0],+tp[1]-1,+tp[2])).getUTCDay();
  var wkStartN=dayNum(t)-((dow+6)%7), monStart=tp[0]+"-"+tp[1]+"-01";
  function agg(from){var r={rev:0,ga:0,vip:0,booth:0,booths:0};
    for(var q=0;q<days.length;q++){var dd=days[q];if(dd.date>=from&&dd.date<=t){r.rev+=(+dd.rev||0);r.ga+=(+dd.ga||0);r.vip+=(+dd.vip||0);r.booth+=(+dd.booth||0);r.booths+=(+dd.booths||0)}}return r}
  function dstr(n){var d=new Date(n*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
  var W=agg(dstr(wkStartN)),T=agg(START);
  function tk(r){return '<td>'+(r.ga+r.vip)+'<small>'+r.ga+' GA &middot; '+r.vip+' VIP</small></td>'}
  function bo(r){return '<td>'+money(r.booth)+'<small>'+r.booths+' booth'+(r.booths===1?'':'s')+'</small></td>'}
  h+='<div class="cell tbl"><div class="card"><table class="bt"><tr><th></th><th>Week to date</th><th>Since Oct 13</th></tr>'
   +'<tr><td>Ticket revenue</td><td>'+money(W.rev)+'</td><td>'+money(T.rev)+'</td></tr>'
   +'<tr><td>Tickets sold</td>'+tk(W)+tk(T)+'</tr>'
   +'<tr><td>Booths sold</td>'+bo(W)+bo(T)+'</tr></table></div></div>';
  $("left").innerHTML=h;
  renderTasks(data.tasks,t);
  fit();
  if(data.updated){
    var u=new Date(data.updated), now=new Date();
    var m=Math.max(0,Math.round((now-u)/60000));
    $("upd").textContent="Data updated "+(m<60?m+" min ago":Math.round(m/60)+" hr ago")+" · since Oct 13";
  }
}
function renderTasks(tk,t){
  var th=$("th"),tl=$("tl"),more=$("tmore");
  if(!tk||!tk.items||tk.date!==t){
    th.innerHTML="Today&rsquo;s tasks &middot; "+fmtDay(t);
    tl.innerHTML='<li style="border:0;padding-left:0;color:#A3A19B;font-weight:normal">Today&rsquo;s task list loads with the next sync.</li>';
    more.innerHTML="";tk=null;return;
  }
  var items=tk.items.slice(0),open=[],done=[];
  for(var i=0;i<items.length;i++){(items[i].done?done:open).push(items[i])}
  var all=open.concat(done);
  th.innerHTML="Today&rsquo;s tasks &middot; "+fmtDay(t)+" &middot; <b>"+done.length+" of "+all.length+" done</b>";
  var h="";
  for(var k=0;k<all.length;k++){var x=all[k];
    h+='<li class="'+(x.done?"d":"")+'"><span class="m"></span><span class="o">'+esc(x.owner||"")+'</span>'+esc(x.title||"")+'</li>';}
  tl.innerHTML=h||'<li style="border:0;padding-left:0;color:#A3A19B;font-weight:normal">No tasks for today.</li>';
  tl.setAttribute("data-n",all.length);
}
// Shrink any big number or list that would overflow its box (window shapes differ from TV shapes).
function fit(){
  var els=document.getElementsByClassName("v");
  for(var i=0;i<els.length;i++){
    var el=els[i], card=el.parentNode;
    el.style.fontSize="";
    var base=parseFloat(window.getComputedStyle(el).fontSize)||40;
    var avail=card.clientWidth-(parseFloat(window.getComputedStyle(card).paddingLeft)||0)*2;
    var size=base,guard=0;
    while(el.scrollWidth>avail+2&&size>14&&guard<60){size=size*0.93;el.style.fontSize=size+"px";guard++}
  }
  var tl=$("tl"),card2=tl.parentNode;
  tl.style.fontSize="";tl.style.height="";
  var cs=window.getComputedStyle(card2);
  var maxH=card2.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0)-$("th").offsetHeight-$("tmore").offsetHeight-14;
  var base2=parseFloat(window.getComputedStyle(tl).fontSize)||24,s2=base2,g2=0;
  tl.style.height="auto";tl.style.overflow="visible";
  while(tl.scrollHeight>maxH&&s2>11&&g2<40){s2=s2*0.94;tl.style.fontSize=s2+"px";g2++}
  tl.style.overflow="hidden";tl.style.height=maxH+"px";
}
window.onresize=fit;
function load(){
  var x=new XMLHttpRequest();
  x.open("GET","data.json?t="+(new Date().getTime()),true);
  x.onreadystatechange=function(){
    if(x.readyState!==4)return;
    if(x.status>=200&&x.status<300){
      try{render(JSON.parse(x.responseText))}catch(e){$("upd").textContent="Data error: "+e.message}
    }else{$("upd").textContent="Waiting for data (status "+x.status+")"}
  };
  x.send();
}
load();setInterval(load,60000);
})();
</script>
</body>
</html>
