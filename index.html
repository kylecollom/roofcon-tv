<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RoofCON 8 Sales Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,600;112,800;125,900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#121211;--panel:#1B1B1A;--ink:#EDECE8;--mute:#A3A19B;--line:#34332F;--hi:#F2B705;--ok:#5FBF86;--warn:#E58A50;
--display:"Archivo","Arial Black",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--display);overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column;padding:2.2vh 3vw;gap:2vh}
.mast{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:.5vh solid var(--ink);padding-bottom:1.6vh}
.mark{font:900 clamp(32px,6.5vh,84px)/.9 var(--display);font-stretch:125%;margin:0;letter-spacing:-.01em}
.mark .o{color:transparent;-webkit-text-stroke:2px var(--mute)}
.sub{font:600 clamp(12px,2vh,26px)/1.3 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);text-align:right}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1.25fr 1fr;gap:1.6vh 1.6vw;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);padding:2vh 1.6vw;display:flex;flex-direction:column;justify-content:center;min-width:0}
.k{font-size:clamp(11px,1.7vh,22px);text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.v{font:800 clamp(30px,9vh,120px)/1.05 var(--display);font-stretch:112%;margin-top:.6vh;white-space:nowrap}
.v.sm{font-size:clamp(26px,6.5vh,88px)}
.n{font-size:clamp(12px,2vh,26px);color:var(--mute);margin-top:.6vh}
.wide{grid-column:span 3}
.bar{height:2vh;background:#262624;margin-top:2vh;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.bar b{position:absolute;top:-.6vh;bottom:-.6vh;width:3px;background:var(--hi)}
.hi{color:var(--hi)}.ok{color:var(--ok)}.warn{color:var(--warn)}
.foot{font:400 clamp(10px,1.6vh,20px) var(--mono);color:var(--mute);display:flex;justify-content:space-between}
@media (max-width:800px){body{overflow:auto}.wrap{height:auto}.grid{grid-template-columns:1fr 1fr;grid-template-rows:auto}.wide{grid-column:span 2}.v{font-size:36px}.v.sm{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <h1 class="mark">ROOF<span class="o">CON</span> 8</h1>
    <div class="sub">Sales board &middot; Nov 10&ndash;12 &middot; Oklahoma City</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot"><span id="upd">Loading&hellip;</span><span>Ticket revenue excludes booths</span></div>
</div>
<script>
const GOAL=150000;
const START="2026-10-13", EVENT="2026-11-10";
const STEPS=[["2026-10-13",125],["2026-10-16",150],["2026-10-23",175],["2026-10-30",197]];
const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(n).toLocaleString("en-US");
function ymdET(d){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"}).format(d)}
function dayNum(s){const[y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5}
function gaPrice(t){let p=STEPS[0][1];for(const[d,v]of STEPS){if(t>=d)p=v}return p}
function nextStep(t){return STEPS.find(([d])=>d>t)||null}
function fmtDay(s){const[y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"})}
function render(data){
  const t=ymdET(new Date());
  const days=data.days||[];
  const sum=k=>days.reduce((a,x)=>a+(+x[k]||0),0);
  const rev=sum("rev"),booth=sum("booth"),booths=sum("booths"),ga=sum("ga"),vip=sum("vip"),pkg=sum("pkg");
  const left=Math.max(0,dayNum(EVENT)-dayNum(t));
  const elapsed=Math.max(0,Math.min(28,dayNum(t)-dayNum(START)+1));
  const pace=GOAL/28*elapsed;
  const diff=rev-pace;
  const need=Math.max(0,GOAL-rev);
  const perDay=left>0?need/left:need;
  const today=days.find(x=>x.date===t)||{rev:0,ga:0,vip:0,pkg:0};
  const ns=nextStep(t);
  const pct=Math.min(100,rev/GOAL*100), pp=Math.min(100,pace/GOAL*100);
  $("grid").innerHTML=`
    <div class="card wide"><div class="k">Ticket revenue &middot; minimum goal ${money(GOAL)}</div>
      <div class="v">${money(rev)} <span style="font-size:.45em" class="${diff>=0?'ok':'warn'}">${diff>=0?'&#9650; ':'&#9660; '}${money(Math.abs(diff))} ${diff>=0?'ahead of':'behind'} pace</span></div>
      <div class="bar"><i style="width:${pct}%"></i><b style="left:${pp}%"></b></div>
      <div class="n">${pct.toFixed(1)}% of goal &middot; need ${money(need)} more &middot; ${money(perDay)}/day to finish</div></div>
    <div class="card"><div class="k">Doors open in</div><div class="v">${left} days</div><div class="n">Tue Nov 10 &middot; OKC Convention Center</div></div>
    <div class="card"><div class="k">GA price now</div><div class="v hi">$${gaPrice(t)}</div><div class="n">${ns?`$${ns[1]} on ${fmtDay(ns[0])}`:"Final price"}</div></div>
    <div class="card"><div class="k">Today so far</div><div class="v sm">${money(today.rev)}</div><div class="n">${+today.ga||0} GA &middot; ${+today.vip||0} VIP${+today.pkg?` &middot; ${+today.pkg} pkg`:""}</div></div>
    <div class="card"><div class="k">Tickets sold (since Oct 13)</div><div class="v sm">${ga+vip+pkg*0}</div><div class="n">${ga} GA &middot; ${vip} VIP${pkg?` &middot; ${pkg} team pkg`:""}</div></div>
    <div class="card"><div class="k">Booths sold (since Oct 13)</div><div class="v sm">${money(booth)}</div><div class="n">${booths} booth${booths===1?"":"s"}</div></div>`;
  const u=data.updated?new Date(data.updated):null;
  $("upd").textContent=u?"Updated "+u.toLocaleString("en-US",{timeZone:"America/New_York",weekday:"short",hour:"numeric",minute:"2-digit"})+" ET":"";
}
async function load(){
  try{
    const r=await fetch("data.json?"+Date.now(),{cache:"no-store"});
    if(!r.ok)throw 0;
    render(await r.json());
  }catch(e){$("upd").textContent="Waiting for data…"}
}
load();setInterval(load,60000);
</script>
</body>
</html>
